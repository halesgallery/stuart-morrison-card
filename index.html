<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="description" content="Stuart Morrison — Managing Director, Hales">
  <title>Stuart Morrison — Hales</title>
  <style>
    :root {
      --paper: #f7f7f4;
      --ink: #11110f;
      --muted: #4f4f4a;
      --rule: #d8d8d1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .card {
      width: min(760px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 11vh 0 8vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 8vw;
      align-items: start;
    }
    .name {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.03;
      font-weight: 600;
      letter-spacing: -0.035em;
    }
    .title {
      margin-top: 9px;
      font-size: clamp(17px, 2.6vw, 22px);
      line-height: 1.25;
    }
    .contact {
      font-size: clamp(16px, 2.5vw, 20px);
      line-height: 1.55;
    }
    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    a:hover, a:focus-visible {
      border-bottom-color: var(--ink);
    }
    .location {
      margin-top: 42px;
    }
    .wordmark {
      margin-top: 13vh;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 500;
      letter-spacing: 0.55em;
      line-height: 1;
      padding-left: 0.55em;
      text-align: center;
    }
    .actions {
      margin-top: 55px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .button:hover, .button:focus-visible {
      background: var(--ink);
      color: var(--paper);
    }
    .footer {
      margin-top: 10vh;
      padding-top: 18px;
      border-top: 1px solid var(--rule);
      font-size: 12px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0.03em;
    }
    @media (max-width: 620px) {
      .card {
        width: min(100% - 36px, 500px);
        padding: 52px 0 34px;
      }
      .top { grid-template-columns: 1fr; gap: 34px; }
      .location { margin-top: 30px; }
      .wordmark { margin-top: 80px; font-size: 29px; letter-spacing: 0.46em; }
      .actions { margin-top: 42px; }
      .button { width: 100%; }
      .footer { margin-top: 70px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <section>
      <div class="top">
        <div>
          <h1 class="name">Stuart Morrison</h1>
          <div class="title">Managing Director</div>
        </div>

        <div class="contact">
          <div><a href="mailto:stuartmorrison@halesgallery.com">stuartmorrison@halesgallery.com</a></div>
          <div><a href="tel:+16465900776">+1 646.590.0776</a></div>
          <div><a href="https://halesgallery.com" target="_blank" rel="noopener">halesgallery.com</a></div>

          <div class="location">
            <div>Hales New York</div>
            <div>547 West 20th Street</div>
            <div>New York, NY 10011</div>
          </div>
        </div>
      </div>

      <div class="wordmark" aria-label="HALES">HALES</div>

      <div class="actions">
        <a class="button" href="contact.vcf">Save Contact</a>
        <a class="button" href="https://halesgallery.com" target="_blank" rel="noopener">Visit Hales</a>
      </div>
    </section>

    <div class="footer">Hales New York</div>
  </main>
</body>
</html>
